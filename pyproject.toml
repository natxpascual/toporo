[project]
name = "azure-cloud-topology-engine"
version = "0.1.0"
description = "Azure Cloud Topology Engine: An AI-Powered Terraform Visualizer and Security Copilot"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "pydantic>=2.10.0",
    "python-hcl2>=4.3.0",
    "jinja2>=3.1.4",
    "networkx>=3.4.0",
    "httpx>=0.28.0",
    "openai>=1.60.0",
    "pytest>=8.3.0",
    "azure-data-tables>=12.5.0",
    "pyjwt>=2.9.0",
    "bcrypt>=4.2.0",
    "python-dotenv>=1.0.1",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
